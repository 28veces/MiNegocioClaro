[build]
  # Build command
  command = "npm run build"

  # Directory to publish (Nuxt Netlify preset outputs to dist)
  publish = "dist"

  # Environment variables for build
  [build.environment]
    NODE_VERSION = "20"

# Redirect rules for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/_nuxt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# API routes (if any in future)
[[redirects]]
  from = "/api/*"
  to = "https://your-firebase-functions-url/:splat"
  status = 200